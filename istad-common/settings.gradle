pluginManagement {
    includeBuild('../build-logic') //common will use build-logic project as a plugin but we dont know which convention it will use

    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}
dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
    versionCatalogs {
        libs {
            from(files("../gradle/libs.versions.toml"))
        }
    }
}
rootProject.name = 'istad-common'

include 'istad-common-domain'
include 'istad-common-webflux'
include 'istad-common-restapi'
include 'istad-common-swagger'