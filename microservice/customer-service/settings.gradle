pluginManagement {
    includeBuild('../../build-logic')

    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}
dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
}

includeBuild('../../istad-common') {
    dependencySubstitution {
        substitute(module('kh.edu.istad:istad-common-domain'))
                .using(project(':istad-common-domain'))

        substitute(module('kh.edu.istad:istad-common-restapi'))
                .using(project(':istad-common-restapi'))
    }
}

rootProject.name = 'customer-service'


include 'customer-service-domain:customer-domain-core'
include 'customer-service-domain:customer-application-service'
include 'customer-service-persistence' //adapter
include 'customer-service-message' //adapter
include 'customer-service-restapi' //adapter
include 'customer-service-main' //chea entry point kleng for include dependancy