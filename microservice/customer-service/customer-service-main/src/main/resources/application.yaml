server:
  port: 9091

spring:
  application:
    name: customer-service
  cloud:
    consul:
      discovery:
        health-check-url: http://host.docker.internal:9091/actuator/health
        instance-id: ${spring.application.name}:${random.value}
  mongodb:
    host: localhost
    port: 2026
    username: mongod
    password: mongod
    database: db_customer
    authentication-database: admin
    uuid-representation: standard
