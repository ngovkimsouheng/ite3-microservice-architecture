plugins {
    id 'springboot-common-conventions'
}

dependencies {
    implementation project(':payment-service-domain:payment-domain-core')
    implementation project(':payment-service-domain:payment-application-service')
    implementation project(':payment-service-persistence')
    implementation project(':payment-service-restapi')
//    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-scalar:3.2.0'
}
