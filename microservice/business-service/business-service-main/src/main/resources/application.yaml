server:
  port: 8084
  forward-headers-strategy: framework
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000
  application:
    name: business-service
  mongodb:
    uri: mongodb://mongod:mongod@localhost:2026/business_db?authSource=admin
    uuid-representation: standard
  data:
    mongodb:
      uri: mongodb://mongod:mongod@localhost:2026/business_db?authSource=admin
      uuid-representation: standard