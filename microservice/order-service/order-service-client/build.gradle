plugins {
    id 'springboot-common-conventions'
    id 'spring-cloud-common-conventions'
}

dependencies {
    implementation project(':order-service-domain:order-application-service')

    // gRPC Client Starter
    implementation 'net.devh:grpc-client-spring-boot-starter:3.1.0.RELEASE'

    // BSR Generated Java SDKs (Protocol Buffers + gRPC Stubs)
    implementation 'build.buf.gen:ngovkimsouheng-org_ecom-proto_protocolbuffers_java:36.2.0.1.20261106033731.e9034b7491e5'
    implementation 'build.buf.gen:ngovkimsouheng-org_ecom-proto_grpc_java:1.85.1.1.20261106033731.e9034b7491e5'

    // Optional / local common module if you still use it for other shared DGs/exceptions
    implementation 'kh.edu.istad:istad-common'

    // WebFlux provides WebClient and HttpInterfaces support
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    testImplementation 'io.projectreactor:reactor-test'

    // OAuth2 client & Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer:5.0.4'
}