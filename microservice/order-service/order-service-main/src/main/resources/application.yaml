server:
  port: 8082

spring:
  config:
    import: "optional:consul:"

  application:
    name: order-service

  profiles:
    active: dev

  main:
    web-application-type: reactive

  cloud:
    consul:
      host: localhost
      port: 8500
      config:
        enabled: true
        format: yaml
        prefixes:
          - config
        data-key: data
        watch:
          enabled: true
          wait-time: 5
          delay: 10000
      discovery:
        port: ${server.port}
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 10s
        service-name: order-service
        instance-id: ${spring.application.name}:${random.value}
        # Automatically deregisters from Consul when the Spring Boot app stops
        deregister: true
        # Automatically removes the instance from Consul if health check fails for 10 seconds
        deregister-critical-service-after: 10s

  security:
    oauth2:
      client:
        provider:
          iam-server:
            issuer-uri: http://localhost:9000
        registration:
          customer-client:
            provider: iam-server
            client-id: customer-client
            client-secret: customer-secret
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
            scope:
              - openid
              - profile
              - customer:read

  r2dbc:
    url: r2dbc:postgresql://localhost:9543/db_order
    username: iteuser
    password: qwerqwer

  liquibase:
    enabled: true
    change-log: classpath:/db.changelog/db.changelog-master.yaml
    url: jdbc:postgresql://localhost:9543/db_order
    user: iteuser
    password: qwerqwer
    driver-class-name: org.postgresql.Driver

http:
  serviceclient:
    customer-service:
      connect-timeout:
        seconds: 10
      read-timeout:
        seconds: 10
      base-url: http://customer-service

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.r2dbc: DEBUG