server:
  port: 8080 # Or whatever your order-service port is

spring:
  config:
    import: "optional:consul:"

  application:
    name: order-service

  profiles:
    active: dev

  main:
    web-application-type: reactive

  cloud:
    consul:
      host: localhost
      port: 8500
      config:
        enabled: true
        format: yaml
        prefixes:
          - config
        data-key: data
        watch:
          enabled: true
          wait-time: 5
          delay: 10000
      discovery:
        health-check-url: http://host.docker.internal:${server.port}/actuator/health
        prefer-ip-address: true
        service-name: order-service
        instance-id: ${spring.application.name}:${random.value}

  r2dbc:
    url: r2dbc:postgresql://localhost:9543/db_order
    username: iteuser
    password: qwerqwer

  liquibase:
    enabled: true
    change-log: classpath:/db.changelog/db.changelog-master.yaml
    url: jdbc:postgresql://localhost:9543/db_order
    user: iteuser
    password: qwerqwer
    driver-class-name: org.postgresql.Driver

  security:
    oauth2:
      client:
        registration:
          customer-client:
            provider: auth-server
            client-id: order-service
            client-secret: order-secret
            authorization-grant-type: client_credentials
            scope: customer:read
        provider:
          auth-server:
            issuer-uri: http://localhost:9000

http:
  serviceclient:
    customer-service:
      connect-timeout:
        seconds: 10
      read-timeout:
        seconds: 10
      base-url: http://customer-service

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    org.springframework.r2dbc: DEBUG

grpc:
  client:
    customer-service:
      address: 'static://localhost:9090'
      negotiation-type: plaintext