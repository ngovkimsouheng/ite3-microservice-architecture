server:
  port: 9000

spring:
  profiles:
    default: dev
  application:
    name: iam-service

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:9543/db_oauth2}
    username: ${DATASOURCE_USERNAME:iteuser}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    driver-class-name: ${spring.datasource.driver-class-name}
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  messages:
    basename: messages

  security:
    oauth2:
      authorizationserver:
        issuer: ${OAUTH2_ISSUER_URI:http://localhost:9000}


      client:
        registration:
          google:
            provider: google
            client-id: ${GOOGLE_OAUTH_CLIENT_ID}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Google

          github:
            provider: github
            client-id: ${GITHUB_OAUTH_CLIENT_ID}
            client-secret: ${GITHUB_OAUTH_CLIENT_SECRET}
            scope:
              - read:user
              - user:email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: GitHub

          facebook:
            provider: facebook
            client-id: ${FACEBOOK_OAUTH_CLIENT_ID}
            client-secret: ${FACEBOOK_OAUTH_CLIENT_SECRET}
            scope:
              - public_profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Facebook
        provider:
          facebook:
            user-info-uri: https://graph.facebook.com/me?fields=id,name,email
            user-name-attribute: id

app:
  oauth2:
    clients:
      registrar:
        secret: ${REGISTRAR_CLIENT_SECRET}
      gateway:
        secret: ${GATEWAY_CLIENT_SECRET}
      web:
        secret: ${WEB_CLIENT_SECRET}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    bot-username: ${TELEGRAM_BOT_USERNAME:}
    public-base-url: ${TELEGRAM_PUBLIC_BASE_URL:http://localhost:9000}

gg:
  jte:
    use-precompiled-templates: true

logging:
  level:
    org.springframework.security: INFO
    org.springframework.security.oauth2: INFO