plugins {
    id 'spring-common-conventions'
    id 'com.github.node-gradle.node' version '7.1.0'
}

// Add this block so Gradle knows where to download libraries:
repositories {
    mavenCentral()
}

dependencies {
    api project(':iam-domain:iam-application-service')
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
}

node {
    download = true
    version = '20.18.0'
    nodeProjectDir = file("${projectDir}")
}

tasks.register('buildFrontend', NpmTask) {
    dependsOn tasks.named('npmInstall')
    args = ['run', 'build']
}

tasks.register('copyFrontend', Copy) {
    dependsOn tasks.named('buildFrontend')
    from "${projectDir}/dist"
    into layout.buildDirectory.dir('resources/main/static')
}

tasks.named('processResources') {
    dependsOn tasks.named('copyFrontend')
}