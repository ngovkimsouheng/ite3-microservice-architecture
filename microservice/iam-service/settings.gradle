pluginManagement {
    includeBuild('../../build-logic')

    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}
dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }

    versionCatalogs {
        libs {
            from(
                    files("../../gradle/libs.versions.toml")
            )
        }
    }
}

includeBuild('../../istad-common') {
    dependencySubstitution {
        substitute(module('kh.edu.istad:istad-common')).using(project(':'))
        substitute(module('kh.edu.istad:istad-common-domain'))
                .using(project(':istad-common-domain'))
        substitute(module('kh.edu.istad:istad-common-restapi'))
                .using(project(':istad-common-restapi'))
        substitute(module('kh.edu.istad:istad-common-swagger'))
                .using(project(':istad-common-swagger'))
    }
}

rootProject.name = 'iam-service'

include 'iam-domain:iam-domain-core'
include 'iam-domain:iam-application-service'
include 'iam-persistence'
include 'iam-infrastructure'
include 'iam-rest-api'
include 'iam-web'
include 'iam-main'