server:
  port: 9999
  reactive:
    session:
      cookie:
        name: GATEWAY_SESSION
        same-site: lax
        path: /

spring:
  application:
    name: gateway-server
  profiles:
    active: dev
  cloud:

    consul:
      discovery:
        health-check-url: http://host.docker.internal:${server.port}/actuator/health
        prefer-ip-address: true
        service-name: ${spring.application.name}
        instance-id: ${spring.application.name}-${random.value}
        enabled: false
        lower-case-service-id: true
    gateway:
      server:
        webflux:
          trusted-proxies: ".*"
          default-filers:
            - SaveSession
            - TokenRelay=

          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: business-service
              order: -1
              uri: http://localhost:8084
              predicates:
                - Path=/business-service/**
              filters:
                - RewritePath=/business-service/?(?<segment>.*), /$\{segment}  # <--- Change to this
                - TokenRelay

            # --- ADD THIS ROUTE BEFORE nextjs ---
            - id: order-service
              order: -1
              uri: http://localhost:8082
              predicates:
                - Path=/order-service/**
              filters:
                - RewritePath=/order-service/?(?<segment>.*), /$\{segment}
                - TokenRelay

            - id: payment-service
              order: -1
              uri: http://localhost:8083
              predicates:
                - Path=/payment-service/**
              filters:
                - RewritePath=/payment-service/?(?<segment>.*), /$\{segment}
                - TokenRelay

            - id: customer-service
              uri: http://localhost:9091
              predicates:
                - Path=/customer-service/**
              filters:
                - RewritePath=/customer-service/?(?<segment>.*), /$\{segment}
                - TokenRelay
            # nextjs must stay at the end as fallback
            #            - id: nextjs
            #              uri: http://localhost:3000
            #              predicates:
            #                - Path=/**
            #              filters:
            #                - RewritePath=/my-customers/?(?<segment>.*), /$\{segment}
            - id: json-placeholder
              uri: https://jsonplaceholder.typicode.com
              predicates:
                - Path=/jph/**
              filters:
                - RewritePath=/jph/?(?<segment>.*), /$\{segment}
          default-filters:
            - TokenRelay
            - SaveSession

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000
      client:
        provider:
          iam-server:
            issuer-uri: http://localhost:9000
        registration:
          front-bff-client:
            provider: iam-server
            client-id: front-bff-client
            client-authentication-method: none
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:9999/login/oauth2/code/front-bff-client
            scope:
              - openid
              - profile


management:
  endpoints:
    web:
      exposure:
        include: "health, gateway"
  endpoint:
    gateway:
      access: read_only

scalar:
  sources:
    - title: Order Service
      url: /order-service/v3/api-docs
    - title: Business Service
      url: /business-service/v3/api-docs
    - title: Payment Service
      url: /payment-service/v3/api-docs
    - title: Customer Service
      url: /customer-service/v3/api-docs


