services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: ite-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false     # disable auth for simple local/presentation demo
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" # limits RAM usage to 512MB
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - ite-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: ite-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://ite-elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - ite-net

networks:
  ite-net:
    external: true